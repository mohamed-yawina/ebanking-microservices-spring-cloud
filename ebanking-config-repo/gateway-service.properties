
# Gateway Service
server.port=8080

# Eureka Discovery Client
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Gateway routes - WebFlux

# Customer Service
spring.cloud.gateway.server.webflux.routes[0].id=customer-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://customer-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/customers/**

# EBank Service
spring.cloud.gateway.server.webflux.routes[1].id=ebank-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ebank-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/accounts/**

# AI Chatbot Service
spring.cloud.gateway.server.webflux.routes[2].id=ai-chatbot-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ai-chatbot-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/chat/**

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only
