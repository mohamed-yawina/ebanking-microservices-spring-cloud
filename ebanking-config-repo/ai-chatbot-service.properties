
server.port=8084

# Gemini
spring.ai.model.chat=google-genai
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.options.temperature=0.3

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# MCP Client
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=ebanking-ai-mcp-client
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s

# MCP Server Streamable HTTP
spring.ai.mcp.client.streamable-http.connections.ebanking.url=${MCP_SERVER_URL:http://localhost:8085}
spring.ai.mcp.client.streamable-http.connections.ebanking.endpoint=/mcp

# Enable MCP tools
spring.ai.mcp.client.toolcallback.enabled=true

# Telegram Bot
telegram.bot.enabled=true
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.allowed-user-id=${TELEGRAM_ALLOWED_USER_ID}

# Discord Bot
discord.bot.enabled=true
discord.bot.token=${DISCORD_BOT_TOKEN}
discord.bot.allowed-guild-id=${DISCORD_ALLOWED_GUILD_ID}
discord.bot.allowed-user-id=${DISCORD_ALLOWED_USER_ID}
